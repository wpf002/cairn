name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Typecheck, tests, substrate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npx tsc -p tsconfig.json
      - name: Tests
        run: npx vitest run
      - name: Substrate gate (invariants 1, 6, 8, 9)
        run: npx tsx packages/substrate/src/cli/validate.ts
